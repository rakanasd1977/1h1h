name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: اختبارات الخادم
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run verify:docs
      - run: npm run verify:tests

  build:
    name: بناء الواجهات الأربع
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer-mobile, admin-panel, provider-panel, agent-panel]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: اختبارات E2E لتطبيق الزبون
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: تثبيت تبعيات e2e
        working-directory: e2e
        run: npm ci
      - name: تثبيت المتصفح وتبعيات النظام
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: تشغيل الاختبارات
        working-directory: e2e
        run: npx playwright test
      - name: رفع تقرير HTML عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  security:
    name: أمان التبعيات والتحليل الساكن (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # فحص الثغرات في تبعيات كل مشروع (server + الواجهات الأربع)
      - name: تثبيت Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: فحص التبعيات (npm audit)
        working-directory: server
        run: npm audit --audit-level=high --omit=dev
      - name: فحص تبعيات الواجهات (npm audit)
        run: |
          for app in customer-mobile admin-panel provider-panel agent-panel; do
            echo "== $app =="
            (cd "$app" && npm audit --audit-level=high --omit=dev) || true
          done

      # تحليل ساكن لقواعد JavaScript (Semgrep) — قواعد OWASP/JS/أمان عامة
      - name: تحليل ساكن للكود (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/javascript
            p/security-audit
            p/secrets
          # تجاهل المجلدات المبنية والتبعيات
          additional_flags: --max-target-bytes=2000000

      # كشف الأسرار في المستودع (مفاتيح/كلمات مرور ملتزمة)
      - name: كشف الأسرار (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
